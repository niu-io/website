services:
  - type: web
    name: niu-website
    runtime: static
    repo: https://github.com/niu-io/website
    branch: main
    buildCommand: npx --yes pnpm@11.25.0 install --frozen-lockfile && npx --yes pnpm@11.25.0 check && npx --yes pnpm@11.25.0 build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: BASE_PATH
        value: /
